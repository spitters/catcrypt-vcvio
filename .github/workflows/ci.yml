name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  # The heavy jobs run on this schedule, on demand, and on pull requests;
  # a push to the default branch runs only the cheap gates (see each job's `if`).
  schedule:
    - cron: '0 3 * * 0'

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone sibling path-deps
        # lakefile.lean requires catcryptCore from "../CatCrypt-core". While the core
        # repo is private the clone needs a PAT (CATCRYPT_CORE_TOKEN secret) with read
        # access to it. The branch is the one whose toolchain and dependency set
        # match this package's manifest (Lean 4.33.1); core's main branch is
        # that tree since the 4.33 merge.
        run: |
          for repo in CatCrypt-core; do
            git clone --depth 1 --branch main \
              "https://x-access-token:${{ secrets.CATCRYPT_CORE_TOKEN }}@github.com/spitters/$repo.git" \
              "../$repo"
          done

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: lake-

      - name: Get Mathlib cache (download oleans; do not build Mathlib from source)
        run: lake exe cache get || true

      - name: Build, which is also the sorry guard
        # The package is built under `-E hasSorry` (see lakefile.lean), so Lean
        # reports a declaration whose proof term reaches `sorryAx` as an error
        # and the build fails on it. The previous separate step grepped the log
        # for "uses 'sorry'" with straight quotes; Lean writes the word in
        # backticks, so that step matched nothing and passed unconditionally.
        run: |
          set -euo pipefail
          lake build 2>&1 | tee build.log

      - name: Guard — no native_decide (keeps the trust base off ofReduceBool)
        run: |
          set -euo pipefail
          found="$(git grep -n 'native_decide' -- 'CatCryptVCVio' || true)"
          if [ -n "$found" ]; then
            echo "::error::native_decide adds the ofReduceBool trust edge:"
            echo "$found"
            exit 1
          fi
