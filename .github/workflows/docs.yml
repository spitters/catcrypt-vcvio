name: docs

on:
  # Not on every push: the doc-gen4 render documents the full Mathlib closure
  # (multi-hour, cold on the first run and after any Mathlib bump). Publish docs
  # on a release, or on demand.
  release:
    types: [published]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; do not cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # doc-gen4 documents the full Mathlib closure (oleans and HTML for ~20k
        # modules), which fills a stock runner; without headroom the cache tarball
        # fails to write. Remove preinstalled toolchains this job does not use.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache docbuild .lake
        uses: actions/cache@v4
        with:
          path: docbuild/.lake
          # The exact key is per run (github.run_id), so every run saves a fresh
          # cache; restore-keys fall back to the newest cache with the same toolchain
          # and dependency versions, and then to the newest cache of any version
          # (Lake re-documents every module whose olean changed).
          key: docbuild-lake-${{ hashFiles('docbuild/lakefile.toml', 'docbuild/lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            docbuild-lake-${{ hashFiles('docbuild/lakefile.toml', 'docbuild/lean-toolchain', 'lake-manifest.json') }}
            docbuild-lake-

      - name: Build the doc-gen4 API reference
        run: |
          cd docbuild
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          lake exe cache get || true   # prebuilt Mathlib oleans
          lake build CatCryptVCVio:docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
