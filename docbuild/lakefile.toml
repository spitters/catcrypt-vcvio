name = "docbuild"
reservoir = false
version = "0.1.0"
# doc-gen4 API reference for the catcrypt-vcvio library, isolated from the main
# package so doc-gen4 is not a dependency of code that requires the library.
# Build from this directory with its own .lake:
#   lake update && lake exe cache get && lake build CatCryptVCVio:docs
# Output: .lake/build/doc/  (open index.html)

[[require]]
name = "catcryptVcvio"
path = "../"

[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4"
# doc-gen4's `v4.33.1` tag is built for Lean v4.33.1 (this project's toolchain).
rev = "v4.33.1"

# mathlib last: its pinned transitive deps must win over doc-gen4's to match the
# published olean cache.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.1"
